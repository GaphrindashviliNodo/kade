<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kade · ადმინი</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kadeadmin.css">
</head>
<body>
<section id="login">
  <h1>Kade</h1>
  <input id="em" type="email" placeholder="ელფოსტა" autocomplete="username">
  <input id="pw" type="password" placeholder="პაროლი" autocomplete="current-password">
  <button id="in">შესვლა</button>
  <p id="err"></p>
</section>

<section id="panel" hidden>
  <header><h1>Kade · მართვა</h1><button id="out" class="ghost">გასვლა</button></header>
  <form id="f">
    <h2 id="ft">ახალი ღვინო</h2>
    <div class="row">
      <label>სახელი (ქართ.)<input name="nka" required></label>
      <label>Name (English)<input name="nen" required></label>
      <label>Название (Русский)<input name="nru" required></label>
    </div>
    <div class="row">
      <label>აღწერა (ქართ.)<textarea name="dka" rows="2"></textarea></label>
      <label>Description (English)<textarea name="den" rows="2"></textarea></label>
      <label>Описание (Русский)<textarea name="dru" rows="2"></textarea></label>
    </div>
    <div class="row">
      <label>ტიპი
        <select name="type">
          <option value="red">წითელი</option><option value="white">თეთრი</option><option value="amber">ქარვისფერი</option>
          <option value="rose">ვარდისფერი</option><option value="sparkling">მოვარვარე</option><option value="dessert">დესერტული</option>
        </select>
      </label>
      <label>ქვეყანა<input name="country"></label>
      <label>ყურძნის ჯიში<input name="grape"></label>
      <label>მწარმოებელი<input name="producer"></label>
      <label>წელი<input name="year" inputmode="numeric"></label>
    </div>
    <div class="row">
      <label>ბოთლის ფასი (₾)<input name="bottle" type="number" step="0.01" min="0" required></label>
      <label class="chk"><input type="checkbox" name="glass" id="glass"> იყიდება ჭიქითაც</label>
      <label id="gp" hidden>ჭიქის ფასი (₾)<input name="glassPrice" type="number" step="0.01" min="0"></label>
      <label>ფოტო<input type="file" id="photo" accept="image/*"></label>
      <img id="pv" alt="" hidden>
    </div>
    <div class="row"><button type="submit" id="save">შენახვა</button><button type="button" id="cancel" class="ghost" hidden>გაუქმება</button></div>
    <p id="msg"></p>
  </form>
  <h2>ღვინოები</h2>
  <div id="list"></div>
</section>
<script type="module" src="kadeadmin.js"></script>
</body>
</html>
